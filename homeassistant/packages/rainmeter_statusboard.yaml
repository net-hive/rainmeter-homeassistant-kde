# HA Status Board - Home Assistant side
# =============================================================================
# Builds www/statusboard.json: a clock panel with two configurable rows.
#
#   STATS  up to 4 slots, each a small label over a value.
#   CHIPS  up to 6 slots, each a coloured name over a smaller sub-line.
#
# Both rows are entirely yours. The skin renders whatever this file emits and
# has no idea what a thermostat is - so a slot can hold a temperature, a power
# reading, a printer's status, the next bin collection, a door, a server, or
# anything else you can turn into a string.
#
# Drop this in config/packages/ and add to configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Empty slots hide themselves and empty rows collapse, so a board with two
# stats and no chips needs no skin edits.
# =============================================================================

template:
  - sensor:
      - name: "Rainmeter Status Board Payload"
        unique_id: rainmeter_statusboard_payload
        icon: mdi:view-dashboard-outline
        # The state is a short fingerprint, not the payload: a state is capped
        # at 255 characters and the document is longer. The automation below
        # triggers on this changing, and the command_line sensor re-renders the
        # real document at that moment. Anything referenced in the payload must
        # also be referenced here, or the board will not update when it changes.
        state: >-
          {{ [ states('sensor.living_room_temperature'),
               state_attr('climate.house', 'hvac_action'),
               state_attr('climate.house', 'temperature'),
               states('person.alex'),
               states('person.blake'),
               states('person.casey'),
             ] | join('|') | truncate(250, true, '') }}

        attributes:
          payload: >-
            {#- =================================================================
                COLOURS. Rainmeter wants a bare "r,g,b" string. Named here so the
                slots below stay readable.
                ================================================================= -#}
            {%- set WHITE = '255,255,255' -%}
            {%- set MUTED = '170,178,190' -%}
            {%- set GREEN = '124,227,139' -%}
            {%- set RED   = '255,110,110' -%}
            {%- set BLUE  = '125,190,255' -%}
            {%- set AMBER = '255,148,90'  -%}

            {#- Handy for a value that should be coloured by how it is doing -#}
            {%- set hvac = state_attr('climate.house', 'hvac_action') -%}
            {%- set hvac_colour = {'heating': AMBER, 'cooling': BLUE}.get(hvac, MUTED) -%}

            {#- =================================================================
                STATS - up to 4. Each entry is (label, value, colour).
                The label is optional; pass '' to show just the value.
                Delete entries you do not want; the row shrinks to fit.
                ================================================================= -#}
            {%- set stats = [
                 ('INSIDE',
                  states('sensor.living_room_temperature') ~ '°',
                  WHITE),
                 ('HVAC',
                  (hvac | title) if hvac else 'Off',
                  hvac_colour),
                 ('SET',
                  (state_attr('climate.house', 'temperature') | round(0) | int | string ~ '°')
                    if state_attr('climate.house', 'temperature') is not none else '--',
                  MUTED),
               ] -%}

            {#- =================================================================
                CHIPS - up to 6. Each entry is (name, colour, sub-line).

                The example is a presence board off person.* entities, with the
                arrival time shown only when they came home today - otherwise
                yesterday's timestamp reads as if they just walked in.

                It does not have to be people. Some other shapes:

                  ('FRONT DOOR', GREEN if is_state('binary_sensor.front','off')
                                 else RED,
                   'Closed' if is_state('binary_sensor.front','off') else 'OPEN')

                  ('PRINTER', GREEN if is_state('sensor.printer','idle') else AMBER,
                   states('sensor.printer') | title)

                  ('BACKUP', GREEN if is_state('binary_sensor.backup_ok','on') else RED,
                   states('sensor.backup_age') ~ 'h ago')
                ================================================================= -#}
            {%- set people = [
                 ('person.alex',  'ALEX'),
                 ('person.blake', 'BLAKE'),
                 ('person.casey', 'CASEY'),
               ] -%}
            {%- set home_states = ['home', 'on', 'true', 'Home'] -%}
            {%- set ns = namespace(chips=[]) -%}
            {%- for entity, label in people -%}
              {%- set home = states(entity) in home_states -%}
              {%- set lc = states[entity].last_changed if states[entity] is not none else none -%}
              {%- set today = home and lc is not none
                              and (lc | as_local).date() == now().date() -%}
              {%- set ns.chips = ns.chips + [(
                    label,
                    GREEN if home else RED,
                    (lc | as_local).strftime('%-I:%M %p') if today else '--'
                  )] -%}
            {%- endfor -%}
            {%- set chips = ns.chips -%}

            {#- =================================================================
                Everything below is plumbing - no need to edit.
                tojson on every value is what stops an apostrophe in a name or a
                quote in a sensor state from breaking the document.
                ================================================================= -#}
            {%- set stats = stats[:4] -%}
            {%- set chips = chips[:6] -%}
            {
              "stat_count": {{ (stats | count) | string | tojson }}
              {%- for i in range(4) -%}
                {%- set s = stats[i] if i < (stats | count) else ('', '', '0,0,0') -%}
              , "s{{ i + 1 }}_label": {{ (s[0] | string) | tojson }},
                "s{{ i + 1 }}_value": {{ (s[1] | string) | tojson }},
                "s{{ i + 1 }}_color": {{ (s[2] | string) | tojson }}
              {%- endfor %},
              "chip_count": {{ (chips | count) | string | tojson }}
              {%- for i in range(6) -%}
                {%- set c = chips[i] if i < (chips | count) else ('', '0,0,0', '') -%}
              , "c{{ i + 1 }}_name": {{ (c[0] | string) | tojson }},
                "c{{ i + 1 }}_color": {{ (c[1] | string) | tojson }},
                "c{{ i + 1 }}_sub": {{ (c[2] | string) | tojson }}
              {%- endfor %}
            }

command_line:
  - sensor:
      name: "Rainmeter Status Board"
      unique_id: rainmeter_statusboard
      # Template attributes come back as native types, so the payload is
      # usually a dict, not a string, and base64_encode rejects it ("a
      # bytes-like object is required, not 'Wrapper'" on HA 2026.9).
      # to_json turns it back into a document; a string passes through as-is.
      command: >-
        python3 /config/rainmeter/write_json.py
        --www /config/www
        --out statusboard.json
        --stamp ts
        --b64 "{% set p = state_attr('sensor.rainmeter_status_board_payload', 'payload') %}{{ (p if p is string else p | to_json) | base64_encode }}"
      scan_interval: 21600
      command_timeout: 15
      value_template: "{{ value_json.ok }}"

automation:
  - id: rainmeter_statusboard_refresh
    alias: "Rainmeter - Refresh status board"
    description: >-
      Rewrites statusboard.json whenever anything on it changes.

      The midnight trigger is what clears yesterday's arrival times: the chip
      template only shows a time if the person came home today, so the board
      needs one re-render after the date rolls over even if nobody has moved.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.rainmeter_status_board_payload
      - trigger: time
        at: "00:00:01"
      - trigger: homeassistant
        event: start
      # Heartbeat: keeps the write-time stamp (--stamp ts) advancing even when
      # nothing on the board changes, so the skin can tell "quiet" from "dead"
      # and grey itself out instead of showing stale data as current.
      - trigger: time_pattern
        minutes: /5
    conditions: []
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rainmeter_status_board
